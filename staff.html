<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>document.write('<link rel="stylesheet" href="assets/app.css?v=' + Math.floor(Date.now() / 60000) + '">');</script>
<title>E級玩家｜工作人員入口</title>
<style>
  body { -webkit-user-select: text; user-select: text; }
  .box { max-width: 460px; margin: 0 auto; padding: 30px 20px 60px; }
  h1 { font-size: 26px; font-style: italic; margin: 18px 0 4px; }
  p { color: #555; margin: 0 0 22px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .y { --team: #F2C200; --team-text: #1C1C1C; }
  .r { --team: #D7191F; --team-text: #fff; }
  .g { --team: #64EA00; --team-text: #1C1C1C; }
  a.pbtn { text-decoration: none; }
</style>
</head>
<body>
<div class="box">
  <img src="assets/nissan-logo.png" alt="NISSAN" style="width:70px">
  <h1>E級玩家｜工作人員入口</h1>
  <p>這一頁不用給參加者。參加者掃活動 QR code 會直接進入遊戲。</p>
  <div class="stack">
    <a class="pbtn pbtn--black" href="qrcodes.html">🖨 活動 QR code（列印）</a>
  </div>
  <h2>正式遊戲（參加者掃 QR code 會進到這裡）</h2>
  <div class="stack">
    <a class="pbtn r" href="./">🎮 開啟遊戲</a>
  </div>
  <h2>測試模式（會顯示辨識比例，可從相簿選圖）</h2>
  <div class="stack">
    <a class="pbtn pbtn--sm y" href="./?test=1">🧪 測試模式</a>
  </div>
</div>
</body>
</html>
