<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>E級玩家｜工作人員入口</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  body { -webkit-user-select: text; user-select: text; }
  .box { max-width: 460px; margin: 0 auto; padding: 30px 20px 60px; }
  h1 { font-size: 26px; font-style: italic; margin: 18px 0 4px; }
  p { color: #555; margin: 0 0 22px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .y { --team: #F2C200; --team-text: #1C1C1C; }
  .r { --team: #D7191F; --team-text: #fff; }
  .g { --team: #64EA00; --team-text: #1C1C1C; }
  a.pbtn { text-decoration: none; }
</style>
</head>
<body>
<div class="box">
  <img src="assets/nissan-logo.png" alt="NISSAN" style="width:70px">
  <h1>E級玩家｜工作人員入口</h1>
  <p>這一頁不用給參加者。參加者請掃各隊 QR code，直接進入隊伍頁面。</p>
  <div class="stack">
    <a class="pbtn pbtn--black" href="qrcodes.html">🖨 三隊 QR code（列印）</a>
  </div>
  <h2>正式頁面</h2>
  <div class="stack">
    <a class="pbtn y" href="yellow.html">閃電E隊（黃）</a>
    <a class="pbtn r" href="red.html">活力E隊（紅）</a>
    <a class="pbtn g" href="green.html">生態E隊（綠）</a>
  </div>
  <h2>測試模式（會顯示辨識比例，可從相簿選圖）</h2>
  <div class="btn-row">
    <a class="pbtn pbtn--sm y" href="yellow.html?test=1">黃</a>
    <a class="pbtn pbtn--sm r" href="red.html?test=1">紅</a>
    <a class="pbtn pbtn--sm g" href="green.html?test=1">綠</a>
  </div>
</div>
</body>
</html>
